upstream django{
    server web:8000;
}

server {
    listen 8080;
    server_name localhost;
    client_max_body_size 100M;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /protect/ {
        internal;
        alias  /app/media/;
    }

    location /static/ {
        alias  /static/;
    }

}