{% extends "layout.html" %}

{% block title %}設定 - シークレットキーを取得する{% endblock %}

{% block navbar %}
    {% include "components/navbar.html" %}
{% endblock %}

{% block content %}
<h1>ワンタイムパスワードのシークレットキーを取得する</h1>
<p>アカウントのワンタイムパスワードのシークレットキーを取得します。</p>
<p class="back-link"><a href="/settings/otp">戻る</a></p>

<!-- パスワードの入力フィールド -->
<p>QRコードをスキャンして、アプリにシークレットキーを登録してください。</p>

<div class="mb-3 text-center">
    <img src="data:image/png;base64,{{ qr_code }}" alt="QRコード" width="200" height="200">
</div>

<div class="mb-3">
    <label for="otp_secret_key" class="form-label">シークレットキー</label>
    <input type="text" class="form-control" value="{{ otp_secret_key }}" readonly>
</div>

{% endblock %}
